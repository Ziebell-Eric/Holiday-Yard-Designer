name: Build desktop installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: build:win
          - os: macos-latest
            command: build:mac
          - os: ubuntu-latest
            command: build:linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: holiday-yard-designer-${{ matrix.os }}
          path: desktop/dist/**
          if-no-files-found: error
